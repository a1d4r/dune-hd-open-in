name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag matches the plugin version
        run: |
          v=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' plugin/play_in_apps/dune_plugin.xml)
          test "$GITHUB_REF_NAME" = "v$v" || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
      # Dunes update only to a greater version_index: a new archive under the
      # old one would never reach them.
      - name: version_index grew since the previous tag
        run: |
          m=plugin/play_in_apps/dune_plugin.xml
          vindex() { sed -n 's:.*<version_index>\(.*\)</version_index>.*:\1:p'; }
          cur=$(vindex <"$m")
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null) ||
            { echo "no earlier v* tag, check skipped"; exit 0; }
          old=$(git show "$prev:$m" 2>/dev/null | vindex || true)
          [ -n "$old" ] || { echo "no version_index in $m at $prev, check skipped"; exit 0; }
          echo "version_index: $old at $prev, $cur at $GITHUB_REF_NAME"
          [ "$cur" -gt "$old" ] || { echo "::error::version_index $cur is not greater than $old at $prev"; exit 1; }
      - name: Build all plugins under PHP 5.3.6, the Dune's version
        run: |
          docker build -t dune-php53 tests/php53
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/w" -w /w dune-php53 \
            sh -ec 'for p in plugin/*/; do sh build.sh "$(basename "$p")"; done'
      - name: Release notes
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          {
            echo "Скачайте zip плагина ниже, в Assets. Установка — в [README]($base/README.md)."
            echo
            for p in plugin/*/; do
              n=$(basename "$p")
              v=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' "$p/dune_plugin.xml")
              echo "- \`$n\` $v — [CHANGELOG]($base/plugin/$n/CHANGELOG.md)"
            done
          } > notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/pages/*/*.tar.gz --title "$GITHUB_REF_NAME" --notes-file notes.md
      # The online update channel: dist/pages/<name>/update_info.xml and the
      # archive it points to. Each deploy replaces the whole site.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
