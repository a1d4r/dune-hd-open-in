name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Cheapest first, and neither needs PHP: a failed PHP download or a broken
      # test must not hide a leak.
      - name: No private IPs or UUIDs
        run: |
          if git grep -n -I -E '192\.168\.|(^|[^0-9.])10\.[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' -- ':!.github'; then
            echo "::error::private IP or UUID in tracked files"
            exit 1
          fi
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The PHP 5.3.6 image has no php-cgi, there these checks go through a CLI
      # stand-in. Only here they see real status and headers. Seconds, before the
      # long run. CGI_ONLY fails without php-cgi, never falls back to the stand-in.
      - name: Logs page under real php-cgi
        run: |
          sudo apt-get update
          sudo apt-get install -y dash php-cli php-cgi
          CGI_ONLY=1 dash tests/play_in_apps_test.sh
      # Last: it downloads and builds PHP, and runs the whole suite twice.
      - name: Shellcheck, tests (dash, mksh), build under PHP 5.3.6, the Dune's version
        run: |
          docker build -t dune-php53 tests/php53
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/w" -w /w dune-php53 \
            sh -ec 'for p in plugin/*/; do sh build.sh "$(basename "$p")"; done'
