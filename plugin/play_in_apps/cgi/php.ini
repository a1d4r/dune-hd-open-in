[php]
cgi.force_redirect = 0
cgi.redirect_status_env = yes
error_reporting = E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED & ~E_WARNING
magic_quotes_gpc = 0
; PHP 5.3.6 has no max_input_vars: cap the body (hash-collision DoS from the LAN).
post_max_size = 8K
file_uploads = Off
display_errors = Off
; Stream the download as it is made.
output_buffering = 0
; No X-Powered-By header.
expose_php = Off
